name: Daily Property Data Update

on:
  schedule:
    - cron: '0 18 * * 1-5'  # UTC 18:00 (KST 03:00), 평일만
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests pandas

      - name: 실거래 데이터 수집 (fetch_data.py)
        run: python fetch_data.py

      - name: apt_trade_data.csv 커밋
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apt_trade_data.csv
          git commit -m "데이터 업데이트: $(date +'%Y-%m-%d')" || echo "변경사항 없음"
          git push

      - name: CSV → JSON 변환 (update_all.py)
        run: python update_all.py

      - name: JSON 파일 커밋 및 배포
        run: |
          git add trade_seoul.json trade_gyeonggi_a.json trade_gyeonggi_b.json trade_incheon.json
          git commit -m "JSON 자동 갱신: $(date +'%Y-%m-%d')" || echo "변경사항 없음"
          git push
