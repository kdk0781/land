name: Daily Property Data Update

on:
  schedule:
    - cron: '0 18 * * 1-5'   # UTC 18:00 = KST 03:00, 평일
  workflow_dispatch:

# [추가] GitHub Actions가 레포지토리에 변경사항을 푸시할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      # [추가] Node.js 20 Deprecation 경고를 해결하기 위해 Node 24 강제 사용
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests pandas

      - name: 전국 실거래 데이터 수집 (fetch_data.py)
        timeout-minutes: 20
        run: python fetch_data.py

      - name: apt_trade_data.csv 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # [개선] 파일이 존재할 경우에만 add 진행하여 에러 방지
          if [ -f apt_trade_data.csv ]; then
            git add apt_trade_data.csv
            
            # [개선] 변경사항(diff)이 있을 때만 commit 및 push 진행
            if ! git diff --staged --quiet; then
              git commit -m "실거래 업데이트: $(date +'%Y-%m-%d')"
              git push
            else
              echo "✅ CSV 파일 변경사항 없음"
            fi
          else
            echo "⚠️ apt_trade_data.csv 파일이 생성되지 않았습니다."
          fi

      - name: CSV → JSON 변환 (update_all.py)
        timeout-minutes: 5
        run: python update_all.py

      - name: 전국 JSON 파일 커밋 및 배포
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # [개선] trade_ 로 시작하는 모든 json 파일을 안전하게 추가
          git add trade_*.json || echo "추가할 JSON 파일이 없습니다."
          
          if ! git diff --staged --quiet; then
            git commit -m "JSON 갱신: $(date +'%Y-%m-%d')"
            git push
          else
            echo "✅ JSON 파일 변경사항 없음"
          fi