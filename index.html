<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수도권 부동산 실거래 & DSR 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .modal-active { overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-slate-600 font-bold">수도권 25만 건 데이터 로딩 중...</p>
    </div>

    <div class="max-w-2xl mx-auto min-h-screen pb-20">
        <header class="p-6 bg-white border-b sticky top-0 z-40 shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-blue-700">Market Anomaly</h1>
                <p class="text-xs text-slate-400 mt-1">수도권 실거래가 순위 & 대출 시뮬레이션</p>
            </div>
            <div class="bg-blue-50 px-3 py-1 rounded-full border border-blue-100">
                <span id="total-count" class="text-blue-700 font-extrabold">0</span><span class="text-blue-700 text-xs tracking-tighter">건 집계</span>
            </div>
        </header>

        <div class="p-4 sticky top-[80px] z-30 bg-slate-50/95 backdrop-blur-md border-b">
            <input type="text" id="search-input" placeholder="아파트명 또는 지역 검색 (예: 잠실, 옥수)" class="w-full px-4 py-3 rounded-2xl border-2 border-white bg-white shadow-sm focus:border-blue-500 focus:outline-none transition-all mb-3 text-sm">
            <div class="flex gap-2">
                <select id="sort-select" class="flex-1 px-4 py-2 rounded-xl border bg-white text-xs font-bold outline-none">
                    <option value="latest">최신 거래순</option>
                    <option value="price_desc">최고가 순위</option>
                    <option value="pyung_desc">평당가 순위</option>
                </select>
            </div>
        </div>

        <main class="p-4 space-y-4" id="trade-list">
            </main>
    </div>

    <div id="dsr-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <div>
                    <h2 class="text-lg font-extrabold text-slate-800">대출 한도 시뮬레이션</h2>
                    <p id="modal-apt-name" class="text-xs text-blue-600 font-bold mt-0.5"></p>
                </div>
                <button onclick="closeDsrModal()" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-400">✕</button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 text-sm">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">매매 가격 (만원)</label>
                    <input type="number" id="calc-price" class="w-full p-3 bg-slate-100 rounded-xl font-bold text-lg outline-none focus:ring-2 focus:ring-blue-500" readonly>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">연간 소득 (만원)</label>
                    <input type="number" id="calc-income" value="6000" class="w-full p-3 border rounded-xl font-bold text-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">스트레스 DSR 단계 (가산금리)</label>
                    <select id="calc-stress" class="w-full p-3 border rounded-xl font-bold bg-white outline-none">
                        <option value="0.75">2단계 (현재 0.75%)</option>
                        <option value="1.15">3단계 (1.15%)</option>
                        <option value="1.5">3단계 (1.5%)</option>
                        <option value="2.87">3단계 (2.87%)</option>
                    </select>
                </div>
                <div class="bg-blue-600 p-5 rounded-2xl text-white">
                    <div class="text-xs opacity-80 mb-1 font-bold">최대 대출 가능 금액 (DSR 40%)</div>
                    <div id="calc-result" class="text-2xl font-black">계산 중...</div>
                    <div class="mt-3 pt-3 border-t border-white/20 flex justify-between items-center">
                        <span class="text-xs font-bold italic text-blue-100">* LTV 70% 별도 확인 필요</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];

        // 데이터 로드
        Papa.parse("apt_trade_data.csv", {
            download: true,
            header: true,
            complete: function(results) {
                allData = results.data.filter(row => row.아파트 && row.거래금액).map(row => {
                    const price = parseInt(row.거래금액);
                    const area = parseFloat(row.전용면적);
                    const pyung = area / 3.3058;
                    const pyungPrice = Math.round(price / pyung);
                    return { ...row, price, pyungPrice, pyung: pyung.toFixed(1) };
                });
                document.getElementById('total-count').innerText = allData.length.toLocaleString();
                document.getElementById('loader').style.display = 'none';
                renderList();
            }
        });

        function renderList() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const sortType = document.getElementById('sort-select').value;
            const listDiv = document.getElementById('trade-list');

            let filtered = allData.filter(item => 
                item.아파트.toLowerCase().includes(searchTerm) || 
                item.법정동.toLowerCase().includes(searchTerm)
            );

            if (sortType === 'price_desc') filtered.sort((a, b) => b.price - a.price);
            else if (sortType === 'pyung_desc') filtered.sort((a, b) => b.pyungPrice - a.pyungPrice);
            else filtered.sort((a, b) => b.년+b.월+b.일 - (a.년+a.월+a.일));

            listDiv.innerHTML = filtered.slice(0, 100).map(item => `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 hover:shadow-md transition-all active:scale-[0.98]">
                    <div class="flex justify-between items-start">
                        <span class="px-2 py-1 bg-slate-100 text-slate-500 text-[10px] font-extrabold rounded-lg mb-2">${item.법정동}</span>
                        <span class="text-[10px] font-bold text-slate-300 italic">${item.년}.${item.월}.${item.일}</span>
                    </div>
                    <h3 class="text-lg font-extrabold text-slate-800 tracking-tighter">${item.아파트}</h3>
                    <div class="mt-3 flex justify-between items-end">
                        <div class="text-sm text-slate-500 font-medium">
                            ${item.전용면적}㎡ (${item.pyung}평) | ${item.층}층
                        </div>
                        <div class="text-right">
                            <div class="text-xl font-black text-blue-700">${(item.price/10000).toFixed(1)}억</div>
                            <div class="text-[10px] font-bold text-slate-400 mt-0.5 underline decoration-blue-200">평당 ${item.pyungPrice.toLocaleString()}만</div>
                        </div>
                    </div>
                    <button onclick="openDsrModal('${item.아파트}', ${item.price})" class="w-full mt-4 py-3 bg-blue-50 text-blue-700 rounded-xl font-bold text-xs hover:bg-blue-100 transition-colors">💰 대출 한도 계산기</button>
                </div>
            `).join('');
        }

        // DSR 계산기 로직
        function openDsrModal(name, price) {
            document.getElementById('modal-apt-name').innerText = name;
            document.getElementById('calc-price').value = price;
            document.getElementById('dsr-modal').classList.remove('hidden');
            document.getElementById('dsr-modal').classList.add('flex');
            calculateDsr();
        }

        function closeDsrModal() {
            document.getElementById('dsr-modal').classList.add('hidden');
            document.getElementById('dsr-modal').classList.remove('flex');
        }

        function calculateDsr() {
            const income = document.getElementById('calc-income').value;
            const stressRate = parseFloat(document.getElementById('calc-stress').value);
            const baseRate = 4.0; // 기준금리 4% 가정
            const totalRate = (baseRate + stressRate) / 100;
            const dsrLimit = income * 0.4; // DSR 40%
            
            // 단순화한 원리금 균등 상환 계산 (40년 기준)
            const n = 40 * 12;
            const r = totalRate / 12;
            const factor = (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            
            const maxLoan = dsrLimit / (factor * 12);
            document.getElementById('calc-result').innerText = Math.floor(maxLoan / 10000) + "억 " + (Math.floor(maxLoan % 10000)).toLocaleString() + "만원";
        }

        document.getElementById('search-input').addEventListener('input', renderList);
        document.getElementById('sort-select').addEventListener('change', renderList);
        document.getElementById('calc-income').addEventListener('input', calculateDsr);
        document.getElementById('calc-stress').addEventListener('change', calculateDsr);
    </script>
</body>
</html>
