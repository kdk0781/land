<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 실거래 랭킹 & DSR 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-slate-600 font-bold">전국 실거래 데이터 분석 중...</p>
    </div>

    <div class="max-w-2xl mx-auto min-h-screen pb-20 bg-white shadow-sm">
        <header class="p-5 bg-white border-b sticky top-0 z-40">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tighter">Market Insight</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Real Estate Analysis Dashboard</p>
                </div>
                <div class="text-right">
                    <span id="total-count" class="text-blue-600 font-black text-xl">0</span><span class="text-slate-500 text-xs font-bold ml-1">건</span>
                </div>
            </div>

            <div class="flex overflow-x-auto gap-2 pb-2 hide-scrollbar" id="category-tabs">
                <button class="tab-btn active" data-mode="latest">⚡ 최신 거래</button>
                <button class="tab-btn" data-mode="volume">🔥 거래량 순위</button>
                <button class="tab-btn" data-mode="top_price">👑 최고가 순위</button>
                <button class="tab-btn" data-mode="gap_invest">🎯 갭투자/전세가율</button>
            </div>
        </header>

        <div class="p-4 bg-slate-50 border-b space-y-2">
            <div class="flex gap-2">
                <select id="sido-select" class="w-1/2 px-3 py-3 rounded-xl border border-slate-200 bg-white text-sm font-bold outline-none focus:border-blue-500 shadow-sm">
                    <option value="all">전체 시/도</option>
                </select>
                <select id="region-select" class="w-1/2 px-3 py-3 rounded-xl border border-slate-200 bg-white text-sm font-bold outline-none focus:border-blue-500 shadow-sm" disabled>
                    <option value="all">구/동 선택</option>
                </select>
            </div>
            <input type="text" id="search-input" placeholder="아파트명 직접 검색" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm outline-none focus:border-blue-500 shadow-sm">
        </div>

        <main class="p-4 space-y-4 bg-slate-50" id="trade-list">
            </main>
    </div>

    <div id="dsr-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col scale-in">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <div>
                    <h2 class="text-lg font-extrabold text-slate-800">대출 한도 시뮬레이션</h2>
                    <p id="modal-apt-name" class="text-xs text-blue-600 font-bold mt-0.5"></p>
                </div>
                <button onclick="closeDsrModal()" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-400">✕</button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 text-sm">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">매매 가격 (만원)</label>
                    <input type="number" id="calc-price" class="w-full p-3 bg-slate-100 rounded-xl font-bold text-lg outline-none text-slate-700" readonly>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">연간 소득 (만원)</label>
                    <input type="number" id="calc-income" value="6000" class="w-full p-3 border rounded-xl font-bold text-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">스트레스 DSR 단계 (가산금리)</label>
                    <select id="calc-stress" class="w-full p-3 border rounded-xl font-bold bg-white outline-none text-sm">
                        <option value="0.75">2단계 (현재 0.75%)</option>
                        <option value="1.15">3단계 (1.15%)</option>
                        <option value="1.5">3단계 (1.5%)</option>
                        <option value="2.87">3단계 (2.87%)</option>
                    </select>
                </div>
                <div class="bg-blue-600 p-6 rounded-2xl text-white mt-2 shadow-lg">
                    <div class="text-[10px] opacity-70 mb-1 font-bold uppercase tracking-widest">Estimated Loan Limit</div>
                    <div id="calc-result" class="text-2xl font-black tracking-tight">0원</div>
                    <p class="text-[9px] mt-4 opacity-50 font-medium leading-relaxed italic">
                        * 40년 상환, DSR 40% 기준이며 실제 한도는 LTV 및 개인 신용도에 따라 상이합니다.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/script.js" defer></script>
</body>
</html>
