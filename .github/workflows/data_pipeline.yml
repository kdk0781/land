name: Daily Property Data Update

on:
  schedule:
    - cron: '0 18 * * *' # UTC 기준 18:00 (한국 시간 새벽 3시)
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run data fetch script
        run: python fetch_data.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apt_trade_data.csv
          git commit -m "Update property data: $(date +'%Y-%m-%d')" || exit 0
          git push

      - name: CSV를 고속 JSON으로 변환
        run: python update_all.py

      - name: 변경된 JSON 파일들 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git add trade_*.json
          git commit -m "Auto-sync: CSV data to optimized JSON" || echo "No changes"
          git push
