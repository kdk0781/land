name: Daily Property Data Update

on:
  schedule:
    - cron: '0 18 * * 1-5'   # UTC 18:00 = KST 03:00, 평일
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4        # v3 → v4 (Node.js 20 deprecated 해결)

      - name: Python 설정
        uses: actions/setup-python@v5   # v4 → v5 (Node.js 20 deprecated 해결)
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests pandas

      - name: 전국 실거래 데이터 수집 (fetch_data.py)
        timeout-minutes: 20
        run: python fetch_data.py

      - name: apt_trade_data.csv 커밋
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apt_trade_data.csv
          git commit -m "실거래 업데이트: $(date +'%Y-%m-%d')" || echo "변경사항 없음"
          git push

      - name: CSV → JSON 변환 (update_all.py)
        timeout-minutes: 5
        run: python update_all.py

      - name: 전국 JSON 파일 커밋 및 배포
        run: |
          git add \
            trade_seoul.json \
            trade_gyeonggi_a.json \
            trade_gyeonggi_b.json \
            trade_incheon.json \
            trade_busan.json \
            trade_daegu.json \
            trade_gwangju.json \
            trade_daejeon.json \
            trade_ulsan.json \
            trade_sejong.json \
            trade_gangwon.json \
            trade_chungbuk.json \
            trade_chungnam.json \
            trade_jeonbuk.json \
            trade_jeonnam.json \
            trade_gyeongbuk.json \
            trade_gyeongnam.json \
            trade_jeju.json
          git commit -m "JSON 갱신: $(date +'%Y-%m-%d')" || echo "변경사항 없음"
          git push
